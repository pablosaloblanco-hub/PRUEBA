notas: 'v1 (editor, grabación g3_23_1746.mp4 del 23/11): formato C «Expectativa vs realidad» en modo llenar. Gancho:
  pantalla partida desde el primer fotograma, «EXPECTATIVA ✨» arriba y «REALIDAD 💀» abajo, con el subtítulo «LO
  QUE CREÍA QUE IBA A PASAR…»; el vuelco de abajo golpea a 1,9 s con «BRO 💀». Remate a pantalla completa con dos
  repeticiones (0,5x y 0,25x) y un plano a 3x del buggy boca abajo; cierre con pregunta. Tramos (g3_23_1746.mp4):
  #1 dividido, arriba 0:00.60-0:04.20 (el buggy sube la cantera; corta antes del cambio de cámara de 0:04.22) y
  abajo 0:09.80-0:13.40 (vuelco); #2 0:11.30-0:13.90 vuelco a pantalla completa + repeticiones 0:11.50-0:12.70 a
  0,5x y 0:11.75-0:12.35 a 0,25x; #3 0:14.20-0:20.20 a 3x, boca abajo echando humo. No se usa nada desde 0:24.00:
  la protagonista sale del buggy a pie. Dentro de la jaula la conductora solo se ve a través de la jaula, borrosa
  y sin cara, de lejos y sin sangre (piel revisada en 0:11.3-0:20.2). Recortes con y0=0,11 (sin la distancia del
  GPS ni el icono rosa de la brújula) y x0≥0,28 (sin minimapa); revisado el gancho a 30 fps: sin carteles, marcadores
  ni policía. La matrícula del buggy es genérica. Memes: EXPECTATIVA ✨, REALIDAD 💀, LO QUE CREÍA QUE IBA A PASAR…,
  PILOTO DE RALLY 🏁, BRO 💀, -1 BUGGY 🛞, FÍSICAS DE GTA 6 🤡, MÍRALO OTRA VEZ 👀, Y OTRA 💀, YO ESPERANDO A LA GRÚA
  🛻, ⏩ x3; cierre ¿LE DAS EL CARNET DE BUGGY? 👇 SÍ O NO. Música propia (musica.py, 138 bpm, tono 4). Sin audio original.
  Duración 15,4 s, 2,31 MB, 720x1280. Minutos usados de g3_23_1746: 0:00.60-0:04.20 y 0:09.80-0:20.20.'
