  instagram: |-
    Expectativa vs realidad en GTA 6 ✨💀

    Yo, subiendo la cantera con el buggy como un piloto de rally. También yo, diez segundos después, dando vueltas de campana y esperando a la grúa boca abajo. Te lo pongo a 0,5x y a 0,25x por si no te lo crees. ¿Le das el carnet de buggy? Comenta sí o no 👇 y etiqueta a quien conduce así.

    Solo en el juego: en la vida real, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
