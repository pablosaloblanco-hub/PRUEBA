notas: |-
  Publicación suelta, 1 imagen: archivo 27-1.jpg. Pieza de comunidad: no afirma ningún dato del juego.
  Ángulo: sábado de juego, pregunta rápida de 3 opciones. Gancho: «TIERRA, MAR O AIRE: ¿cómo te mueves por Leonida?». Bloque interactivo de 3 opciones: «🚗 T · TIERRA · Sobre ruedas» / «🚤 M · MAR · Sobre el agua» / «🚁 A · AIRE · Desde arriba». CTA en píldora magenta: «COMENTA T, M O A 👇».
  PROHIBIDO nombrar modelos de coche, barcos, aviones o marcas: no hay nada de eso en «Datos verificados». Solo las tres categorías genéricas.
  Captura: Vice_City_15 (en la misma foto salen coches en el puente, un yate en el agua y un helicóptero en el cielo: las tres opciones). No hay armas a la vista.
  No repite formato con el 3/12 (A/B/C de GTA Online): aquí las letras son T/M/A y el tema es de juego libre.
  Pablo: responder en la primera hora; si alguien cuenta una misión en la que usa un vehículo, ocultar el comentario.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.
  CAPTURA (director, 19/11): Vice_City_15 (puerto con yates). Vice_City_17 está vetada: redada policial con armas.

