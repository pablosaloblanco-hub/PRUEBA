notas: |-
  Carrusel, 5 diapositivas: archivos 26-1.jpg … 26-5.jpg.
  Ángulo: aniversario. Hoy hace 3 años (4/12/2023 → 4/12/2026) del tráiler 1, contado como LA HISTORIA DE AQUEL DÍA, un dato por diapositiva: el plan, el adelanto por la filtración, las primeras 24 horas y dónde estamos hoy. Gancho de portada: «HOY HACE 3 AÑOS: el día que GTA 6 se adelantó».
  NO REPETIR EL 25/11 («Los récords de GTA 6 antes de salir»): allí los datos del tráiler 1 iban juntos en una tarjeta y como récord. Aquí no salen ni el tráiler 2 ni el Guinness, no se habla de «récords» en la portada y el peso está en la fecha y en el recuerdo de la comunidad. Que el redactor no copie frases del 25/11.
  «3 años» es la fecha del dato «Tráiler 1» comparada con hoy: no hace falta fila nueva. NO usar «1.081 días entre el tráiler y el estreno» salvo que el coordinador lo apunte antes en «Datos verificados» como cálculo propio (4/12/2023 → 19/11/2026).
  Nada de lo que se ve en el tráiler (escenas, personajes, canción): no está en «Datos verificados» y es terreno de historia.

  GUION:
  1/5 · portada (Vice_City_16, cara de «no me lo creo»): etiqueta «HOY HACE 3 AÑOS» · título «3 AÑOS DEL <ye>TRÁILER 1</ye>» · subtítulo «Así fue el 4 de diciembre de 2023» · chips: 4/12/2023 · SE ADELANTÓ UN DÍA · 93 M EN 24 H.
  2/5 · datos (Vice_City_11, skyline de noche), rótulo «EL ADELANTO»: tarjetas «EL PLAN · 5 DE DICIEMBRE · El día previsto» / «LO QUE PASÓ · 4 DE DICIEMBRE · Se adelantó un día» / «POR QUÉ · UNA FILTRACIÓN · Rockstar lo lanzó antes de tiempo».
  3/5 · datos (Leonida_Keys_01, hidroavión), rótulo «LAS PRIMERAS 24 HORAS»: «VISITAS · 93 MILLONES · En YouTube, en 24 horas» / «EL RÉCORD · Nº 1 · El vídeo no musical más visto en su primer día en YouTube».
  4/5 · datos (Raul_Bautista_03, atardecer en barco), rótulo «3 AÑOS DESPUÉS» (no rotular con el nombre del personaje): «ENTONCES · 4/12/2023 · El primer vistazo» / «EL ESTRENO · 19/11/2026 · Ya se puede jugar» / «HOY · 4/12/2026 · Tres años y ya estamos en Leonida».
  5/5 · cierre (Raul_Bautista_01, al teléfono: «lo vimos todos en el móvil»): brocha «¿Dónde viste el tráiler 1?» · subtítulo «Manda esto a quien lo vio contigo» · botones COMENTA / GUARDA / COMPARTE.
  Texto: arrancar con «Hoy hace 3 años…», pedir que lo manden a quien lo vio con ellos (objetivo compartir) y que cuenten dónde lo vieron, sin spoilers.
  Pablo: responder en la primera hora a los que cuenten dónde lo vieron.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.

  GUION DISEÑO:
  (5 imágenes, archivos 26-1.jpg … 26-5.jpg. Datos: filas «Tráiler 1» y «Lanzamiento»; los «3 años» salen de comparar el 4/12/2023 con la fecha de publicación. Nada del tráiler 2, del Guinness ni de lo que se ve en el tráiler. Ningún rótulo con el nombre de un personaje. Cierre cambiado por el director: «¿Dónde estabas cuando lo viste?».)

