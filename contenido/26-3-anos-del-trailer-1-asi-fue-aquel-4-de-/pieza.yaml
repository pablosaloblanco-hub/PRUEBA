textos:
  instagram: |-
    Hoy hace 3 años, GTA 6 se nos adelantó un día 📅

    El tráiler 1 tenía fecha para el 5 de diciembre de 2023, pero una filtración hizo que Rockstar lo sacara el día 4. En sus primeras 24 horas sumó 93 millones de visitas en YouTube y se convirtió en el vídeo no musical más visto en su primer día en la plataforma. Desde el 19 de noviembre ya nos movemos por Vice City y Leonida, así que cuéntanos en comentarios dónde estabas cuando lo viste 👇 y manda esto a quien lo vio contigo 📲

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Trailer
