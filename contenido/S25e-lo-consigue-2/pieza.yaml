  v1 (editor, grabación g3_19_2322.mp4): formato D «¿Lo consigue?» con dos momentos. Gancho: «COMENTA SÍ O NO ANTES DE VERLO 👇» desde el primer fotograma; cada momento se congela antes del desenlace con «¿LO CONSIGUE? 🤔» y cuenta 3-2-1. Tramos (g3_19_2322.mp4): #1 28:38.00-28:40.00 (pick-up amarilla derrapando en la autopista, plano aéreo; congelado) y 28:40.00-28:43.00 (la endereza: «SÍÍÍ 😎»; empieza después del menú de pausa de 28:34-28:37); #2 16:05.60-16:08.65 (deportivo rojo hacia la curva; congelado) y 16:08.65-16:09.40 (se mete en el arbusto: «NO 💀», «-1 ARBUSTO 🌺»). Recortes: #1 [0.25,0.30,0.71,0.90] (sin brújula con la distancia rosa ni minimapa), #2 [0.27,0.11,0.73,0.80] (sin subtítulos de la llamada, aviso de llamada ni estrellas). Sin policía, peatones ni personajes. Música propia (musica.py, 134 bpm, tono 6). Sin audio original. Duración 15,5 s, 2,64 MB, 720x1280. Minutos usados de g3_19_2322: 16:05.60-16:09.40 y 28:38.00-28:43.00.
