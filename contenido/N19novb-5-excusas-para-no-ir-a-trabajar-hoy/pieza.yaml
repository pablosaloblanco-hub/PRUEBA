notas: |-
  Solo TikTok (carrusel de fotos). 7 diapositivas: archivos N19novb-1.jpg … N19novb-7.jpg.
  Ángulo: humor del día del estreno, recuperado del plan retirado (carrusel 10). Gancho de portada: «HOY MEDIA ESPAÑA TIENE FIEBRE» + «5 excusas para no ir a trabajar».
  1 portada (Vice_City_16: «no me lo creo»). 2 «Tengo fiebre… de Vice City» (Cal_Hampton_03, flotador en la piscina). 3 «Se me ha roto el coche» (Brian_Heder_01, al volante). 4 «Llamada urgente: me mudo a Leonida» (Raul_Bautista_01, al teléfono). 5 «No he dormido: salió a las 00:00 en la Península» (Leonida_Keys_03, el del bar tirado en la mesa). 6 «Me voy de escapada a un motel de Port Gellhorn» (Port_Gellhorn_01, motel). 7 cierre: «¿Cuál vas a usar? Comenta el número» + comenta / guarda / comparte (Vice_City_22, gasolinera de neón).
  Nada de fingir bajas reales con datos médicos: tono claramente de broma.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite entre el 19 y el 26/11.
