notas: 'v1 (editor, grabación g3_19_2322.mp4): formato J «Vida diaria absurda» con horario del día. Sin el tatuador:
  la escena de 5:21-6:15 es una conversación con la dependienta con subtítulos (indica una casa sobre pilotes en
  Peach Palm Drive) y queda fuera por diálogo. Gancho: «POV: tu sábado en Vice City 🌴» y «SIN CAMISETA Y A LA TIENDA
  🛍️» desde el primer fotograma; cierre ¿Y TU SÁBADO CÓMO ES? 👇. Tramos (g3_19_2322.mp4): 4:22.50-4:24.60 entrada
  a la tienda; 4:41.50-4:45.50 a 1,4x, camiseta de tirantes; 4:49.00-4:52.00 a 1,4x, sudadera negra (aviso de «indumentarias
  desechables» fuera del recorte); 6:35.00-6:41.00 a 2x, en moto con la sudadera; 11:20.50-11:28.60 a 2,5x, pasillos
  del supermercado (corta antes de las neveras con anuncios de cerveza). Recortes con y0=0,11 y x0≥0,25 (sin dinero,
  estrellas, minimapa ni avisos). Aparecen indicaciones de botón «COGER LA INDUMENTARIA» de la tienda (interfaz,
  no misión). Memes: POV, SIN CAMISETA Y A LA TIENDA 🛍️, LOOK 1: TIRANTES 💪, LOOK 2: SUDADERA NEGRA A 35 GRADOS
  🥵, 10/10, Y A DAR UNA VUELTA CON LA SUDADERA 🏍️, LA COMPRA DE LA SEMANA 🛒, SOLO SNACKS 🍫🥤 y las horas 10:00-12:00.
  Música propia (musica.py, 120 bpm, tono -4). Sin audio original. Duración 16,8 s, 2,59 MB, 720x1280. Minutos usados
  de g3_19_2322: 4:22.50-4:24.60, 4:41.50-4:45.50, 4:49.00-4:52.00, 6:35.00-6:41.00 y 11:20.50-11:28.60.'
