  instagram: |-
    BLACK FRIDAY EN LEONIDA: solo puedes llevarte uno 🛒

    Hoy todo el mundo va de compras, pero en GTA VI el chollo de verdad es el plan: A) escapada a Leonida Keys, islas unidas por puentes; B) ruta con los moteros de Ambrosia; o C) todoterreno por Mount Kalaga, en la frontera norte. Vice City puede esperar un rato, que GTA 6 tiene mucho más mapa 🌴 Comenta A, B o C 👇 y etiqueta a quien se viene contigo.

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
