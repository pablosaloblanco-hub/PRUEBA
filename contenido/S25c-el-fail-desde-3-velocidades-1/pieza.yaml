notas: 'v1 (editor, grabación g3_19_2322.mp4): formato I «El fail desde 3 velocidades». NO es la caída de 0:30:
  tras ella el personaje lleva rozaduras rojas en codo y antebrazo (de la caída de 0:05) y se ve al ponerse en pie,
  así que se usa el choque múltiple del deportivo rojo de 15:41, que no enseña al personaje. Gancho: golpe a 0,9
  s con zoom, temblor, boom y «BRO 💀»; cierre ¿A QUÉ VELOCIDAD LO HAS ENTENDIDO? 👇. Tramos (g3_19_2322.mp4): 15:40.70-15:43.70
  a velocidad normal + repeticiones 15:41.10-15:43.10 a 0,5x (zoom 1,15) y 15:41.45-15:42.75 a 0,25x (zoom 1,35)
  con congelado. Recorte [0.27,0.11,0.73,0.80]: sin estrellas, «Crimen denunciado», aviso de llamada, minimapa ni
  subtítulos. Sin peatones ni policía en el cruce. Memes: VELOCIDAD NORMAL ▶️, BRO 💀, ¿QUÉ ACABA DE PASAR? 😳, MÍRALO
  OTRA VEZ 👀, Y OTRA 💀, EL OTRO COCHE: MODO AVIÓN ✈️. Música propia (musica.py, 126 bpm, tono -2). Sin audio original.
