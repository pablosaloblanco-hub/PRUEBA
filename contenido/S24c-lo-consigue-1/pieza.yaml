notas: 'v1 (editor). Material: g3_20_1933.mp4 (g3_20_1819 descartada entera por el arma a la espalda). Formato D
  (¿lo consigue?), modo cuadrado. Concepto: la lancha se mete por un hueco entre el manglar y un poste con un pájaro;
  se congela justo antes, «¿LO CONSIGUE? 🤔» y 3-2-1, y se revela que pasa rozando. Tramos (g3_20_1933): #1 09:43.6-09:47.95
  + congelado 2 s con 3-2-1; #2 09:47.95-09:52.0 (pasa entre el poste y las ramas) + repetición 0,4x 09:48.0-09:49.0.
  Memes: COMENTA SÍ O NO ANTES DE VERLO, POV: ATAJO POR LOS MANGLARES, ¿LO CONSIGUE?, 3-2-1, ¡SÍ!, EL PÁJARO: 😐,
  LAS RAMAS: HOLA, POR UN PELO; cierre ¿HABÍAS DICHO SÍ O NO? 👇. Revisado a resolución completa: el personaje lleva
  camiseta de tirantes y una bolsa, sin armas; en la lancha solo hay cañas de pescar; sin HUD (plano de cámara cinemática
  de conducción sin minimapa), sin menús, llamadas, policía ni marcadores; la matrícula de la lancha es normal.
  No coincide con los tramos de R24nove (5-15.6, 127-143.2, 400.8-409, 461-464 s). Música propia (musica.py, 134
  bpm, tono -4). Sin audio original. Duración 15,1 s, 2,5 MB, 720x1280. Guion: trabajo/<id>/guion.json. Hoja: trabajo/<id>/hoja_fotogramas.jpg.
  Minutos usados: g3_20_1933 09:43.6-09:52.0.'
