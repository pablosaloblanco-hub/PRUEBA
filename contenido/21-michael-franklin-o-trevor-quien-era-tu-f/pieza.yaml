    13 años después, la pregunta sigue en pie: ¿Michael, Franklin o Trevor? 🎮

    GTA V salió el 17/09/2013 con tres protagonistas en Los Santos, y 13 años, 2 meses y 2 días después ya estamos en Vice City con GTA VI. Pero hay debates que ni GTA 6 consigue cerrar 😂 Comenta M, F o T 👇 y etiqueta a quien siempre elegía al otro.

