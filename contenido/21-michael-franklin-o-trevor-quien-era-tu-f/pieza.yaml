notas: 'Ángulo: nostalgia de domingo y debate clásico. Gancho: «13 años después, la pregunta sigue en pie: ¿Michael,
  Franklin o Trevor?». Formato suelta: foto completa + bloque de 3 opciones (M / F / T) + píldora «Comenta tu favorito».
  1 imagen. Captura: Vice_City_17 (atardecer, puente, yates y luces de policía: ambiente de acción). No hay pack
  oficial de GTA V permitido: no usar imágenes de GTA V, solo el nombre de los 3 protagonistas en texto. Sin spoilers
  de GTA V tampoco: nada del final ni de qué le pasa a cada uno; solo nombres, Los Santos y 2013. Dato de apoyo
  en un chip: «GTA V: 17/09/2013 · 3 protagonistas» y «13 años, 2 meses y 2 días de espera».'
