notas: |-
  Carrusel, 5 diapositivas: archivos 31-1.jpg … 31-5.jpg.
  Ángulo: lista de cosas de juego libre para quien quiere desconectar de la historia, sacadas tal cual de la fila «Zonas de Leonida». Gancho de portada: «9 COSAS PARA HACER EN LEONIDA QUE NO SON LA HISTORIA». Llamada: «¿Cuántas llevas de 9? Guárdalo».
  OJO CON EL 2/12 («Diccionario de Leonida»): los nombres coinciden. Aquí cada tarjeta es una ACCIÓN (verbo + sitio), no una definición, y la llamada es «marca cuántas llevas». Que el redactor no reutilice las frases del diccionario.
  Fuera la caza de Mount Kalaga (lleva a armas): solo pesca y rutas todoterreno.
  No prometer que todo está abierto desde el principio (no sabemos si alguna zona se abre con la historia): decir «cuando llegues» o «si ya has llegado», nunca «desde el minuto 1».
  No rotular una foto con un barrio concreto: el rótulo de cada foto es la zona de su carpeta.

  GUION:
  1/5 · portada (Mount_Kalaga_National_Park_06, kayak bajo el puente): etiqueta «SIN SPOILERS» · título «9 COSAS PARA HACER EN <ye>LEONIDA</ye>» · subtítulo «…que no son la historia» · chips: 9 PLANES · 6 ZONAS · GUÁRDALO.
  2/5 · datos (Vice_City_26, piscina desde arriba), rótulo «VICE CITY»: «01 · PASEA · Ocean Beach» / «02 · PIÉRDETE · Little Cuba» / «03 · CURIOSEA · El mercadillo Tisha-Wocka».
  3/5 · datos (Grassrivers_03, hidrodeslizador entre manglares), rótulo «GRASSRIVERS»: «04 · ACÉRCATE · Al puerto de Vice City» / «05 · CRUZA · Los puentes entre las islas de Leonida Keys» / «06 · MÉTETE · En los pantanos y manglares de Grassrivers».
  4/5 · datos (Mount_Kalaga_National_Park_05, animales en el río), rótulo «MOUNT KALAGA»: «07 · BUSCA · Las atracciones cerradas de Port Gellhorn» / «08 · MIRA · La refinería de azúcar Allied Crystal, en Ambrosia» / «09 · SAL · De pesca o de ruta todoterreno por Mount Kalaga».
  5/5 · cierre (Grassrivers_02, pueblo sobre pilotes): brocha «¿Cuántas llevas de 9?» · subtítulo «Comenta tu número y guarda la lista» · botones COMENTA / GUARDA / COMPARTE.
  Pablo: responder en la primera hora; ocultar comentarios que relacionen sitios con misiones.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.
