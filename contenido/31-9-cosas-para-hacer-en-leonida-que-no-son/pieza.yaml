textos:
  instagram: |-
    ¿Y si hoy en GTA 6 no haces ni una misión? 🌴

    Hemos juntado 9 planes para Leonida que no son la historia, solo con lo que Rockstar ha contado de sus zonas: de pasear por Ocean Beach en Vice City a cruzar los puentes de Leonida Keys o salir de pesca por Mount Kalaga 🎣 Ve tachando a medida que llegues a cada zona, sin prisa. Comenta cuántas llevas de 9 y guarda la lista para tu próxima tarde en GTA VI 👇

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GuiaGTA6
