textos:
  instagram: |-
    No pierdas tu mejor momento en Leonida 🎮 Guía rápida de PS5 para grabar tus clips de GTA 6.

    Doble pulsación del botón Crear y guardas los últimos 30 s; desde el menú Crear puedes guardar de 15 s a 1 h de partida reciente o empezar una grabación nueva de hasta 1 h. Guarda el post para tenerlo a mano 📌 y mándanos tu clip por DM (sin spoilers): compartimos los mejores mencionándote 🎬 ¿Juegas en Xbox Series X/S? Tu clip también vale.

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #PS5
