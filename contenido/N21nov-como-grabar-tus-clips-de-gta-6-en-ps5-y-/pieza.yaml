      (info, EN AJUSTES, CAPTURAS Y EMISIONES, Entra en los Ajustes de la consola, ye)
      (pad, Y LUEGO, ACCESOS DIRECTOS, Del botón Crear: ahí cambias qué hace la doble pulsación, cy)
      (bolt, SI NO LO TOCAS, 30 S, Es lo que guarda la doble pulsación por defecto, mag)

  6/6 · close("Places/Vice City/Vice_City_19.jpg", ...)
    título (brocha): ¡Mándanos tu clip!
    subtítulo: Por DM y sin spoilers: compartimos los mejores mencionándote 🎬 · ¿Juegas en Xbox Series X/S? También vale
    botones: (send, MANDA TU CLIP) · (save, GUARDA) · (users, COMPARTE)

  DISEÑO (diseñador): portada con title size=120 y foto desplazada (pos 25%) para que se vea el piloto entero. Cierre: subtítulo partido en 3 líneas con <br> («Por DM y sin spoilers 🎬 / Compartimos los mejores mencionándote / ¿Juegas en Xbox Series X/S? También vale»): se quitan los dos puntos y el « · », mismo contenido. Resto sin cambios.
  CAPTURA (director, 19/11): Grassrivers_03 sustituida por Places/Leonida Keys/Leonida_Keys_04.jpg: una mujer, quizá Lucia, apunta con una escopeta a un caimán. Bloqueada.
