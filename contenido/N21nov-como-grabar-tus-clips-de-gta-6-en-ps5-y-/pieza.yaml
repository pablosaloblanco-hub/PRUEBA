notas: |-
  Carrusel útil, 6 diapositivas: archivos N21nov-1.jpg … N21nov-6.jpg. Recuperado del plan retirado («Mándanos tu clip + cómo grabar»).
  Ángulo: primer sábado de juego; que nadie pierda su mejor momento. Gancho de portada: «NO PIERDAS TU MEJOR MOMENTO EN LEONIDA».
  1 portada (Mount_Kalaga_01, motos de cross). 2 Doble pulsación del botón Crear = guarda los últimos 30 s (Leonida_Keys_01, hidroavión). 3 Menú Crear › Guardar partida reciente: de 15 s a 1 h (Grassrivers_03, hidrodeslizador). 4 Grabación nueva: hasta 1 h (Mount_Kalaga_06, kayak). 5 Cambiar el atajo: Ajustes › Capturas y emisiones › Accesos directos del botón Crear (Leonida_Keys_07, bajo el agua). 6 cierre: «Mándanos tu clip por DM (sin spoilers) y compartimos los mejores mencionándote» (Vice_City_19).
  PENDIENTE DE INVESTIGADOR: cómo grabar en Xbox Series X/S (no está en «Datos verificados»). Si no se verifica antes de redactar, la guía va solo de PS5 y se dice «guía de PS5».
  Pablo: revisar los DM del 21 al 23/11 y pasar los clips que valgan (sin spoilers); se comparten siempre mencionando al autor.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite entre el 19 y el 26/11.

  GUION DISEÑO:
  TOTAL = 6. Guía SOLO de PS5 (lo de Xbox no está verificado: no se explica cómo se graba en Xbox). Clases de color: ye / cy / mag.

  1/6 · cover("Places/Mount Kalaga National Park/Mount_Kalaga_National_Park_01.jpg", ...) (motos de cross)
    kicker: GUÍA DE PS5
    título: NO PIERDAS TU <span class="ye">MEJOR MOMENTO</span> EN <span class="mag">LEONIDA</span>
    subtítulo: Cómo grabar tus clips de GTA 6 en PS5, en 4 pasos
    chips: (bolt, ÚLTIMOS 30 S) · (clock, DE 15 S A 1 H) · (cam, GRABACIÓN NUEVA) · (send, MÁNDANOS TU CLIP)

  2/6 · info("Places/Leonida Keys/Leonida_Keys_01.jpg", ...) (hidroavión)
    etiqueta: 01 · EL ATAJO
    subetiqueta: DOBLE PULSACIÓN
    tarjetas:
      (bolt, PULSA DOS VECES, BOTÓN CREAR, El botón Crear del mando de PS5, ye)
      (save, SE GUARDAN, LOS ÚLTIMOS 30 S, Es lo que hace por defecto, cy)
      (check, CUÁNDO, AL MOMENTO, Justo después de la jugada que quieres guardar, mag)

  3/6 · info("Places/Grassrivers/Grassrivers_03.jpg", ...) (hidrodeslizador)
    etiqueta: 02 · PARTIDA RECIENTE
    subetiqueta: MENÚ CREAR
    tarjetas:
      (pad, EN EL MENÚ CREAR, GUARDAR PARTIDA RECIENTE, Elige esta opción, ye)
      (clock, DURACIÓN, DE 15 S A 1 H, Tú decides cuánto tiempo guardar, cy)
      (save, PARA, UN RATO LARGO, Cuando el momento ha durado más de 30 s, mag)

  4/6 · info("Places/Mount Kalaga National Park/Mount_Kalaga_National_Park_06.jpg", ...) (kayak)
    etiqueta: 03 · GRABACIÓN NUEVA
    subetiqueta: GRABA LO QUE VIENE
    tarjetas:
      (cam, OPCIÓN, GRABACIÓN NUEVA, Empieza a grabar desde ese momento, ye)
      (clock, MÁXIMO, HASTA 1 H, De partida seguida en un solo clip, cy)
      (eye, IDEAL PARA, RUTAS Y PASEOS, Una vuelta en kayak o en coche por Leonida, mag)

  5/6 · info("Places/Leonida Keys/Leonida_Keys_07.jpg", ...) (bajo el agua)
    etiqueta: 04 · CAMBIA EL ATAJO
    subetiqueta: AJUSTES DE PS5
