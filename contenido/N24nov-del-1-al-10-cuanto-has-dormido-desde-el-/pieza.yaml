    Del 1 al 10: ¿cuánto has dormido desde el jueves? 😴

    GTA 6 salió el jueves a las 00:00 y desde entonces hay gente que ha visto más amaneceres en Leonida que por su ventana. El 1 es «¿dormir? ¿qué es eso?» y el 10, «como un bebé (no he jugado)». Comenta tu número 👇 y etiqueta a quien no ha salido de Vice City desde el jueves 🌴

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #HumorGamer
