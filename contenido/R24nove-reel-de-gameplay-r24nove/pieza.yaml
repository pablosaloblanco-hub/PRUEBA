notas: 'v1 (editor, grabación g3_20_1933.mp4): formato K «Relax / paseo bonito» (no había salto ni paso por tierra
  con desenlace para el formato D). Concepto: paseo en lancha por los canales de Grassrivers a vista de dron, sin
  memes, con subtítulos de narrador serenos, música tranquila y guiño final: la lancha «aparca» en la orilla de
  hierba con sello 10/10. Gancho: plano aéreo con el sol reflejado y «POV: desconectas un rato en Grassrivers 🌅».
  Cierre: ¿TE QUEDARÍAS A VIVIR AQUÍ? 🌿👇. Tramos (g3_20_1933.mp4): 0:05.00-0:08.00, 0:12.60-0:15.60, 2:07.00-2:10.00
  (panorámica), 2:20.20-2:23.20, 7:41.00-7:44.00 (sol en el agua) y 6:40.80-6:49.00 a 2x (la lancha sube a la orilla
  de hierba; empieza después del mapa de 6:35-6:39 y del primer plano de 6:40.50). Fuera: 0:40-0:55 (pantalla roja),
  interiores de 4:45-6:00, móvil y mapas. Recorte cuadrado [0.30,0.08,0.70,0.80] (sin brújula, distancia, minimapa
  ni avisos de «conducción automática»). Revisado a 30 fps: sin marcadores rosas, caimanes, sangre ni carteles;
  en 0:13.0-0:14.2 cruzan espátulas rosadas (aves) por abajo a la derecha. El personaje solo se ve de lejos en la
  lancha. Música propia tranquila (musica.py, 92 bpm, tono -3). Sin audio original. Duración 21,9 s, 2,56 MB, 720x1280.
  Minutos usados de g3_20_1933: los de arriba.'
