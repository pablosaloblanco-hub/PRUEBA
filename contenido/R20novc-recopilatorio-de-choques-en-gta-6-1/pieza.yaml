notas: 'Concepto: recopilatorio de 5 choques reales de la grabación b (19/11) con memes, zoom, temblor y sonidos propios; gancho: el golpe contra la farola en el primer segundo; repetición a cámara lenta del choque del cruce; cierre con pregunta. Tramos (gta6_20261119_b.mp4): #1 37:25.0-37:28.8 farola y cámara de choque; #2 36:27.6-36:30.3 señal y choque en el cruce (+ repetición 36:28.7-36:29.7 a 0,4x); #3 52:11.6-52:14.3 contra el seto; #4 52:14.3-52:15.8 roce con el bus; #5 50:02.9-50:04.7 por poco con el camión. Memes: ESPERA AL #2 💀, BRO 💀, ¿QUIÉN HA PUESTO ESA FAROLA?, -1 SEÑAL 🚧, MI SEGURO VIENDO ESTO 😭, MODO KAMIKAZE 🔥, EL GPS: SIGA RECTO, -1 SETO 🌳, EL BUS: 😐, PERDÓN 🙏, POV: CONDUCES EN VICE CITY, CASI 😳; cierre ¿CUÁL HA SIDO EL PEOR? 👇. Música propia (musica.py, 128 bpm, tono 0). Sin audio original. Duración 18,0 s, 2,68 MB, 720x1280. Guion: trabajo/<id>/guion.json.'
