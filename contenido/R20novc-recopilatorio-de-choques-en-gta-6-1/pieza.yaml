textos:
  instagram: |-
    Los choques más tontos de GTA 6 💀

    Una farola que nadie vio venir, una caravana aparcada que no tenía culpa de nada, un seto que se cruzó en mi camino y un bus que solo pedía respeto. Al camión lo esquivé por poco, que también cuenta. ¿Cuál ha sido el peor? Comenta el número 👇 y etiqueta a quien conduce así en Vice City.

    Solo en el juego: en la vida real, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
