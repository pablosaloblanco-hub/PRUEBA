notas: 'Vídeo de 28 s (720×1280) con el gameplay de Pablo del 19/11. Tramos (minuto de la grabación): 22:12 lancha
  entre manglares (8 s) · 29:10 a pie por la selva (7 s) · 29:34 cruzando el pantano (7 s) · 22:26 lancha llegando
  al embarcadero (6 s). Sin audio original; música propia (musica.py 29 s, 88 BPM, -3 semitonos). Franja inferior
  de 400 px (los subtítulos de este tramo salen más altos) y superior de 240 px: tapan subtítulos, objetivos y GPS.
  Publicación extra pedida por Pablo el 19/11 a las 11:00: «dos post hoy con gameplay del primer día, uno a las
  12 y otro luego, además de lo programado» (supera el máximo diario de Instagram por decisión expresa de Pablo).'
