  Bloque de 3 opciones: A · Paseo por Ocean Beach / B · Café en Little Cuba / C · Mercadillo Tisha-Wocka. CTA: «Comenta A, B o C».
  Nada de misiones ni de cómo se desbloquea nada (no está verificado).
  Captura: Vice_City_09 (calle con murales y coche clásico).
