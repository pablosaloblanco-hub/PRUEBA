    Del 1 al 10: ¿cuánto respetas las normas de tráfico en Vice City? 🚦

    Sé sincero, que aquí no hay examen práctico. El 1 es «¿semáforo? ¿qué semáforo?», el 5 es «según el día» y el 10, conductor ejemplar que pone el intermitente hasta para aparcar en Leonida. Comenta tu número 👇 y etiqueta a quien aparca fatal en GTA 6 (ya sabes quién) 😂

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #HumorGamer
