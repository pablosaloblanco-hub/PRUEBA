  Publicación suelta, 1 imagen: archivo 29-1.jpg. Humor de comunidad: no afirma datos del juego.
  Ángulo: lunes de puente, broma clásica de GTA. Gancho: «DEL 1 AL 10: ¿cuánto respetas las normas de tráfico en Vice City?». Bloque interactivo: escala 1–10 con los extremos «1 · ¿Semáforo? ¿Qué semáforo?» y «10 · Conductor ejemplar», y en medio «5 · Según el día». CTA en píldora magenta: «COMENTA TU NÚMERO 👇».
  Escala distinta de la del 24/11 («cuánto has dormido»): mismo formato, tema distinto, dos semanas después.
  Nada de atropellos, persecuciones policiales ni violencia en el texto ni en la imagen: el chiste es saltarse semáforos y aparcar fatal.
  Captura: Vice_City_04 (dos tipos posando en la calle, actitud de «yo conduzco como quiero»). Sin armas.
  Pablo: responder en la primera hora con humor (p. ej. «un 1 es carné retirado»).
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.
