notas: 'Ángulo: glosario de referencia para quien empieza a jugar o lee comentarios y no pilla los nombres. Formato
  distinto de «Las 6 zonas» (20/11) y «Personajes» (24/11): entradas cortas tipo diccionario, 3 tarjetas por diapositiva.
  Gancho portada: «DICCIONARIO DE LEONIDA: 12 nombres que vas a oír sin parar». 6 diapositivas: 1) portada (Vice_City_09);
  2) Leonida (estado inspirado en Florida) · Vice City (inspirada en Miami) · Ocean Beach (Vice_City_15); 3) Little
  Cuba · Tisha-Wocka (mercadillo) · Leonida Keys (Leonida_Keys_02); 4) Grassrivers · Port Gellhorn («la costa olvidada»)
  · Mount Kalaga (Grassrivers_02 o Port_Gellhorn_01, el motel encaja con «moteles baratos»); 5) Ambrosia · Allied
  Crystal (refinería de azúcar) · Only Raw Records (sello de Dre''Quan, socio de Boobie Ike) (Ambrosia_04 / DreQuan_Priest_04);
  6) cierre (Vice_City_27): «¿Qué nombre te costó más? Guarda el diccionario». No rotular una foto con un barrio
  concreto (Ocean Beach, Little Cuba…) si no sabemos que es ese sitio: rotular con la zona. Nada de misiones ni
  papeles en la historia.'
