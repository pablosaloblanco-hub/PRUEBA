textos:
  instagram: |-
    ¿Tisha-Wocka? ¿Allied Crystal? Si en GTA 6 no pillas la mitad de los nombres, esto es para ti 📖

    Hemos juntado 12 nombres de Leonida que vas a oír sin parar en GTA VI, de Vice City a Only Raw Records, solo con lo que ha presentado Rockstar y cero historia 🌴 Guarda el diccionario para tenerlo a mano y comenta el número (del 01 al 12) del que más te costó 👇

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GuiaGTA6
