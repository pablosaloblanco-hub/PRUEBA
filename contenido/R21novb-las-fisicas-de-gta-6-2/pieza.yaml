textos:
  instagram: |-
    Las farolas de Vice City me tienen manía 💡

    Un poste, un semáforo de noche, un atajo entre arbustos, un camión y una pick-up contra la última farola: el marcador no pinta bien. Mi seguro ya no me coge el teléfono. ¿Quién gana: yo o las farolas? Comenta 👇 y etiqueta a quien pierde igual contra el mobiliario de Leonida.

    Solo en el juego: en la vida real, las farolas se respetan.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
