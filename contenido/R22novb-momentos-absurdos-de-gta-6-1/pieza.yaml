notas: |-
  Concepto: momentos absurdos de una misma noche: cruzar la carretera entre los faros y cambiar tres veces de vehículo (camioneta → coche rojo → camión con tráiler) en vez de ir a casa. Memes encima, zoom, temblor y sonidos propios. Montado con `efectos` (guion en trabajo/<id>/guion.json), modo cuadrado, título «LO MÁS ABSURDO DE MI PARTIDA 🤡».
  Duración: 21,4 s (720×1280, 2,6 MB). Música propia (musica.py, 136 bpm, tono −3), sin audio original.
  Tramos de la grabación gta6_20261119.mp4 (minuto): #1 45:04,3–45:08,0 se baja del coche y cruza entre los faros (gancho, con repetición a cámara lenta 45:04,7–45:06,1) · #2 45:40,0–45:45,9 deja la camioneta y va a por el coche rojo (×2,5) + 45:49,6–45:50,8 abre la puerta (se salta 45:46–45:49, aviso «Romper la ventana») · #3 46:44,2–46:50,8 aparca el coche rojo y va a por un camión (×2; termina antes del aviso de 46:51) · #4 46:59,0–47:14,0 se lleva el camión con tráiler (×3).
  Memes: «ESPERA AL CAMIÓN 🚚», «MODO FROGGER 🐸», «MIRA A LOS DOS LADOS 👀», «ESTE YA NO ME GUSTA», «EL DE AL LADO: 👀», «ME LO QUEDO 😎», «1 MINUTO DESPUÉS…», «ESTE TAMPOCO 🙄», «EL CAMIÓN: 👀», «EL GPS: VE A CASA 🏠», «YO: 🚚💨», «CARNET DE CAMIÓN: NO TENGO». Cierre: «¿CUÁL ES EL MÁS ABSURDO? 👇».
  Gamma para los planos de noche: #1 1,8 · #2 1,9 (puerta 1,7) · #3 1,7 · #4 1,7. Recorte sin brújula, distancia del GPS, marcadores, minimapa, avisos, subtítulos ni objetivos. Sin cinemáticas, diálogos, armas ni atropellos.
  V2 (19/11, editor): devuelta por el revisor (rótulo «Brian's» en el fuselaje, marcador rosa de destino y misión del hidroavión de Brian). Quitados enteros los tramos del hidroavión y la natación (32:00,6–32:03,6, 32:20,9–32:22,7 y 29:44–29:51). Nuevo gancho: cruzar la carretera entre los faros. Nuevo tramo #3 (46:44,2–46:50,8). No repite tramos con R22nova ni con R20nov (46:38–46:44).
  Descartados de la grabación: la huida del atraco (10:15–11:08, historia), la lancha con disparos, 45:28 (corte de cámara sin HUD), 48:00 (pelea) y 48:13 (sacar a alguien del coche).
