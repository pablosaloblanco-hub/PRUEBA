textos:
  instagram: |-
    Lo más absurdo de mi partida de GTA 6 🤡

    Aterrizo el hidroavión con el ala casi en el agua, derrapo en el agua como si fuera hielo, llego nadando tarde a mi propio vuelo, cruzo la carretera en modo Frogger, cambio de coche porque el otro ya no me gusta y acabo en un camión que me quedo. Leonida no estaba preparada. ¿Cuál es el más absurdo? Comenta el número 👇 y etiqueta a quien juega igual de raro.

    Solo en el juego: en la vida real, se cruza por el paso de peatones.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Gameplay
