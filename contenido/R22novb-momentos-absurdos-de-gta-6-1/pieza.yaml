textos:
  instagram: |-
    Lo más absurdo de mi partida de GTA 6 🤡

    Cruzo la carretera entre los faros en modo Frogger, dejo la camioneta porque ya no me gusta, me quedo un coche rojo, me bajo del coche rojo porque tampoco, y el GPS diciendo «ve a casa» mientras me llevo un camión con tráiler sin carnet de camión. Una noche cualquiera en Leonida. ¿Cuál es el más absurdo? Comenta el número 👇 y etiqueta a quien cambia de coche igual que de idea.

    Solo en el juego: en la vida real, se cruza por el paso de peatones.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Gameplay
