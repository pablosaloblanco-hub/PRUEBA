  Concepto: momentos absurdos de la partida (física y decisiones raras) con memes encima, zoom, temblor y sonidos propios. Montado con `efectos` (guion en trabajo/<id>/guion.json), modo cuadrado, título «LO MÁS ABSURDO DE MI PARTIDA 🤡».
