  instagram: |-
    Así conduzco en Vice City y mi profesor de autoescuela no lo sabe 🚗💀

    Un retrovisor menos, un adelantamiento por los pelos, un roce con perdón incluido, un «atajo» fuera de la carretera y una camioneta que se lleva una señal y acaba contra unos barcos aparcados. ¿Cuál ha sido el peor? Comenta el número 👇 y etiqueta a quien conduce igual que tú en GTA 6.

    Solo en el juego: en la vida real, como en la autoescuela de verdad.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
