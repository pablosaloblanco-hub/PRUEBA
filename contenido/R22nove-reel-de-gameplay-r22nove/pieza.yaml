notas: 'v2 (editor, tras la revisión): fuera el antiguo #2 (trompo 3:15.40-3:19.40: coche de policía con luces y
  estrella de búsqueda). Nuevo #2 8:03.10-8:05.00: la pick-up sale de la gasolinera con la puerta abierta y el motor
  echando humo (empieza en 8:03.10 para que no salga el aviso «Servicios»; sin policía ni estrellas). En el #4 lo
  que sale volando es el capó: pegatina «EL CAPÓ: ADIÓS 👋» y textos de TikTok y YouTube corregidos (ni trompo ni
  señal). Congelados un poco más largos en #3, #4 y #5 y cierre de 2,8 s para llegar a 15 s. Concepto «POV: conduces
  en Vice City»: cinco desastres de conducción de día (todoterreno y pick-up amarilla). Gancho: el todoterreno contra
  la moto de agua remolcada en el primer segundo (golpe a 0,25 s) con «-1 MOTO DE AGUA 🌊» y «BRO 💀»; repetición
  a 0,35x; cierre con pregunta. Tramos (g2_2106.mp4): #1 22:15.35-22:16.15 todoterreno contra la moto de agua (recorte
  bajo, y0=0,30) + repetición 22:15.40-22:15.90 a 0,35x; #2 8:03.10-8:05.00 salida de la gasolinera con humo; #3
  3:19.90-3:22.30 atajo por la mediana (sin estrellas de búsqueda, comprobado; subtítulos de la llamada fuera del
  recorte); #4 5:20.30-5:21.30 sale volando el capó; #5 8:05.00-8:08.30 derrape y camión por poco. Recortes con
  y0=0,11 (sin brújula ni marcadores) y sin minimapa, GPS ni subtítulos. Memes: ESTO VA BIEN 👍, -1 MOTO DE AGUA
  🌊, BRO 💀, MI SEGURO VIENDO ESTO 😭, PUERTA ABIERTA, MOTOR EN HUMO 💨, TODO BIEN 👍, EL GPS: SIGA RECTO, ATAJO POR
  EL CÉSPED 🌱, EL CAPÓ: ADIÓS 👋, YO CON EL CARNET RECIÉN SACADO, CASI 😳; cierre ¿CUÁL HA SIDO EL PEOR? 👇. Música
  propia (musica.py, 124 bpm, tono 5). Sin audio original. Duración 15,1 s, 2,51 MB, 720x1280. Minutos usados de
  g2_2106: 3:19.90-3:22.30, 5:20.30-5:21.30, 8:03.10-8:08.30 y 22:15.35-22:16.15 (3:15.40-3:19.40 ya no se usa).'
