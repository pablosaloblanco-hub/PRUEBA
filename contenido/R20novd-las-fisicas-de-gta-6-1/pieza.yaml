  instagram: |-
    Las físicas de GTA 6 no tienen piedad 🤡

    Bajarse del coche en marcha, parkour de nivel olímpico, un camión que aparece de la nada y una señal que no volverá a ser la misma. Todo normal en Vice City. ¿Cuál te ha dolido más? Comenta el número 👇 y etiqueta a quien conduce igual que tú en Leonida.

    Solo en el juego: en la vida real, cinturón y con calma.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
