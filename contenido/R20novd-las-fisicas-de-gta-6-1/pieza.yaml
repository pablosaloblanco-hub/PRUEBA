textos:
  instagram: |-
    Las físicas de GTA 6 no tienen piedad 🤡

    Una furgoneta en el puente, un segundo choque con trompo de regalo, un salto de valla de nivel olímpico, unas obras que me llevo por delante, una roca que me deja a dos ruedas y un derrape de noche que iba a salir perfecto. Todo normal en Vice City. ¿Cuál te ha dolido más? Comenta el número 👇 y etiqueta a quien conduce igual que tú en Leonida.

    Solo en el juego: en la vida real, cinturón y con calma.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Gameplay
