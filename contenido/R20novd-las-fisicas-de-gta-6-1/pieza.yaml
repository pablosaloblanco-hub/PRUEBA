  GIRE SUAVEMENTE, -1 SEÑAL 🚧, NO LO VI 😭, 2 SEGUNDOS DESPUÉS…, OTRA VEZ NO 💀; cierre «¿CUÁL TE HA DOLIDO MÁS? 👇».
