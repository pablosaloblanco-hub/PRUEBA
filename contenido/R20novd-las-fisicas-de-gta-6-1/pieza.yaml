  «LAS FÍSICAS DE GTA 6 🤡». Fuente: gta6_20261119_c.mp4. Tramos: #1 17:24.35–17:27.35 (salta del coche en marcha
  y rueda por el puente; repetición 17:24.45–17:25.25 a 0,4x); #2 21:33.30–21:35.10 (salta una valla); #3 10:22.30–10:25.80
  a 1,15x (camión volcado en la calzada); #4 10:47.20–10:50.20 (derrape y señal derribada); #5 18:27.90–18:29.40
  (choque contra una furgoneta en el puente); #6 18:31.30–18:33.00 (segundo choque y trompo). Memes: BAJARSE EN
