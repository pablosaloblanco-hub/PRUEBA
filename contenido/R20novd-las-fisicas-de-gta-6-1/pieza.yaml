notas: 'v2 (tras devolución del revisor): fuera la caída del coche del sheriff (17:24, sangre) y el derrape de 10:47 (policía persiguiendo). Concepto: recopilatorio de físicas absurdas (choques, trompos, saltos, vuelcos y derrapes) con memes, sonidos propios, zoom y temblor; repetición a cámara lenta del #1 y cierre con pregunta. Modo cuadrado, título en pantalla «LAS FÍSICAS DE GTA 6 🤡». Fuente: gta6_20261119_c.mp4. Tramos: #1 18:27.90–18:29.40 (choque contra una furgoneta en el puente; repetición 18:28.10–18:29.00 a 0,4x); #2 18:31.30–18:33.00 (segundo choque y trompo); #3 21:33.30–21:35.10 (salta una valla); #4 10:22.30–10:25.80 a 1,15x (camión volcado en la calzada); #5 10:58.10–10:59.90 (el coche pisa una roca y sale a dos ruedas); #6 37:19.90–37:22.20 con gamma 1,8 (derrape nocturno; cortado antes de que asome el marcador de destino). Memes: ESTO VA BIEN 👍, NO LO VI 😭, 💀, 2 SEGUNDOS DESPUÉS…, OTRA VEZ NO 💀, MODO PARKOUR 🤸, OLÍMPICO 🥇, TODO NORMAL EN VICE CITY 👍, ¿Y ESE CAMIÓN? 🚛, ¿QUIÉN
  HA PUESTO ESA PIEDRA? 🪨, MODO RALLY 🏁, YO CON EL CARNET RECIÉN SACADO, PLAN PERFECTO, EJECUCIÓN… 💀; cierre «¿CUÁL TE HA DOLIDO MÁS? 👇». Música propia (musica.py, 128 bpm, tono +2). Sin audio original. Duración 16,4 s. Ojo redactor: los textos actuales citan «bajarse del coche en marcha» y «una señal», que ya no salen.'
