  instagram: |-
    Radio Leonida 🎙️ El podcast de los NPC de Vice City

    Episodio 1: llegaron los jugadores. Mari, la de los batidos de Ocean Beach, y Chuy, taxista (sin taxi desde el miércoles), comentan lo que está pasando en la ciudad: pick-ups en palmeras, gente en el jacuzzi con zapatos y señales de tráfico por los suelos.

    Pregunta del día: ¿qué es lo más absurdo que has hecho en tu primera hora en Vice City? Cuéntalo en comentarios 👇 y síguenos para el episodio 2.

