notas: 'v1 (editor). v2 (director): título nuevo «MI SEGURO ODIA GTA 6 💀» (el anterior coincidía con R23novd); tramos
  y memes iguales. Concepto: «MI SEGURO ODIA GTA 6 💀», 5 golpes de día en conducción libre (grabación g2_1958, 19/11),
  casi todos con el deportivo blanco. Gancho: choque frontal bajo el paso elevado en el primer frame con «ESPERA
  AL #2 💀» y «BRO 💀», zoom, temblor, destello y boom; repetición a 0,4x. Tramos (g2_1958.mp4): #1 03:43.85-03:45.9
  (choque frontal bajo el puente; + repetición 03:43.85-03:44.75 a 0,4x); #2 03:58.5-04:02.8 a 1,3x (valla y farola);
  #3 01:57.6-01:59.3 (deportivo rojo contra una pickup en el cruce); #4 03:52.6-03:56.4 a 1,2x (roce con un todoterreno
  y a la acera); #5 03:20.8-03:22.0 (bolsas de basura). Memes: ESPERA AL #2, BRO, EL OTRO COCHE: 💀, MODO KAMIKAZE,
  -1 VALLA, ¿QUIÉN HA PUESTO ESA FAROLA?, EL GPS: SIGA RECTO, NO LO VI, POV: CONDUCES EN VICE CITY, PERDÓN, LA ACERA
  TAMBIÉN ES CARRETERA, ESTO VA BIEN, -1 BOLSA DE BASURA; cierre ¿CUÁL HA SIDO EL PEOR? 👇. Matrícula personalizada
  (texto malsonante) pixelada con seguimiento en todos los planos traseros. HUD (brújula, marcador con distancia,
  minimapa y GPS) fuera del recorte (y0 0,12); el #2 se corta antes de que salga el aviso «Gira a la derecha» (04:03)
  y no se usa nada desde 04:04 (tienda Big Shots). Sin estrellas ni policía; los peatones de la valla del #1 están
  quietos y no se tocan (revisado cada 0,1 s); sin sangre ni armas. Música propia (musica.py, 126 bpm, tono -5).
  Sin audio original. Duración 16,5 s, 2,59 MB, 720x1280. Guion: trabajo/<id>/guion.json. Hoja: trabajo/<id>/hoja_fotogramas.jpg.
  Minutos usados de g2_1958: 01:56.8-02:00, 03:20.5-03:27, 03:43-03:47, 03:52.5-03:56.5, 03:58.5-04:05.'
