  instagram: |-
    Mi seguro odia GTA 6 💀

    Un choque frontal bajo el puente, una valla y una farola que no vi venir, un todoterreno en el cruce, una acera que también era carretera y unas bolsas de basura que pasaban por allí. Espera al segundo. ¿Cuál ha sido el peor? Comenta el número 👇 y etiqueta a quien te deja su coche (y a su seguro).

    Solo en el juego: en la vida real, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
