  fotograma (golpe a 0,15 s) con «ESPERA AL #3 💀» y «BRO 💀»; repetición a 0,4x; cierre con pregunta. Tramos (g2_2106.mp4):
  #1 30:56.45-30:58.00 pick-up roja contra la pick-up gris + repetición 30:56.45-30:57.15 a 0,4x (subtítulo de insultos
  del otro conductor en la franja de abajo, fuera del recorte); #2 5:12.30-5:14.00 contra el sedán negro junto al
  cartel «Key Lento» (nombre de lugar, no de la historia); #3 5:15.50-5:17.60 trompo en la mediana; #4 5:06.60-5:08.30
  se lleva conos y roza un remolque; #5 3:22.50-3:24.00 sale por el césped junto a la señal de límite 40 (corta
  antes de girar hacia la calle; peatones lejos, sin contacto); #6 5:25.40-5:27.40 llega a la gasolinera con el
  motor echando humo. Recortes con y0=0,11 (sin brújula, distancia ni marcadores) y sin minimapa, GPS ni subtítulos.
