  instagram: |-
    GTA 6 pero conduzco yo 🚗💥

    Una pick-up roja que decide que el carril contrario también es suyo, un cartel de Key Lento que no vi venir, un trompo en la mediana, tres conos menos, un atajo por el césped con el límite a 40 y un motor echando humo en la gasolinera. ¿Me das el carnet? Comenta sí o no 👇 y etiqueta a quien conduce igual.

    Solo en el juego: en la vida real, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
