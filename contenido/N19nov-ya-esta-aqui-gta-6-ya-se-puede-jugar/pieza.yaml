textos:
  instagram: |-
    ¡YA ESTÁ AQUÍ! 🔥 GTA 6 ya se puede jugar en PS5 y Xbox Series X/S.

    13 años, 2 meses y 2 días después de GTA V, GTA VI nos abre Vice City y Leonida desde las 00:00 (en Canarias, una hora más tarde) 🌴 Si aún no lo tienes, hoy es el último día para llevarte el bonus Vintage Vice City Pack, que es para compras antes del 20/11. Comenta A si juegas en PS5, B si es en Xbox Series X/S o C si aún no lo tienes, y dinos desde dónde juegas esta noche 👇

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6YaEstaAqui
