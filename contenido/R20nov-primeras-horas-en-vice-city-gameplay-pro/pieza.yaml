notas: |-
  Reel de 27,5 s (720×1280) con el gameplay de Pablo grabado en PS5 el 19/11 (grabación de 50 min en Drive).
  Tramos usados (minuto de la grabación): 31:06 avioneta sobre las islas · 17:32 lancha bajo el puente · 17:05 lancha en mar abierto · 18:04 lancha a contraluz · 30:51 avioneta al atardecer · 46:17 conducción de noche.
