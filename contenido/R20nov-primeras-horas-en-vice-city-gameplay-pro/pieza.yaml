notas: |-
  Reel de 27,5 s (720×1280) con el gameplay de Pablo grabado en PS5 el 19/11 (grabación de 50 min en Drive).
  Tramos usados (v2, minuto de la grabación): 30:51 avioneta al atardecer (7 s) · 30:36 avioneta a pleno sol (6 s) · 42:20 camioneta de noche (7 s) · 46:16 coche de noche (8 s). Solo planos desde atrás: sin el rótulo «Brian's» de la avioneta.
  Descartado: créditos iniciales, todas las cinemáticas (cárcel, conversación en la lancha, hangar), el móvil del juego y la persecución de las 10:40 (diálogo malsonante). Sin audio original: los diálogos y la radio son historia o tienen licencia.
  La franja inferior (franja.png) TAPA los subtítulos de diálogo y los objetivos de misión, que son historia. Gancho 0–3,2 s (gancho.png) y pregunta final (cierre.png). Música propia generada por código (musica.py), sin derechos.
  Publicación: 20/11 18:00. En Instagram sustituye a la publicación N20nov de las 10:00 (máximo 1 de feed al día); en TikTok se suma a N20nov.
  V2 (19/11, director): devuelta la v1 por el revisor — los tramos de lancha eran una persecución de misión con un acompañante disparando un arma larga y marcadores de objetivo. Quitados los tres tramos de lancha. La franja superior tapa ahora también la brújula y la distancia del GPS. Pregunta final: «¿Avioneta o coche?».
