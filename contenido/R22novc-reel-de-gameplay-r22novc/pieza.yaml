  instagram: |-
    Las físicas de GTA 6 no son normales 🤡

    Mi pick-up amarilla se subió a una palmera en plan cabra, aterrizó como pudo, se empotró contra una barca y acabó con una señal de tráfico en la caja. Y todo en la misma carrera. ¿Qué nota le das al conductor del 1 al 10? Comenta 👇 y etiqueta a quien conduce así en Vice City.

    Solo en el juego: en la vida real, despacio y con cabeza.

