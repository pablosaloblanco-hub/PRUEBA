  instagram: |-
    Expectativa vs realidad en GTA 6 💀

    Arriba, lo que tenía pensado: un paseo tranquilo en lancha por aguas turquesas. Abajo, lo que pasó de verdad: al atardecer, de frente contra una pickup que acabó dando vueltas. ¿A ti también te pasa? Cuéntalo en comentarios 👇 y etiqueta a quien siempre dice «hoy voy tranquilo».

    Solo en el juego: en la vida real, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
