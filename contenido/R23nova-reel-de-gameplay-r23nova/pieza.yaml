  instagram: |-
    Cosas que solo pasan en Vice City 🌴

    Salir del coche y atravesar un seto con aterrizaje de 10, meterse en el jacuzzi del hotel con ropa y todo, colar la bola 8 y la blanca a la vez en el billar, un roce «de nada» y aparcar como si no hubiera mañana. ¿Cuál es más de Vice City? Comenta el número 👇 y etiqueta a quien haría lo mismo.

    Solo en el juego: en la vida real, despacio y con cabeza.

