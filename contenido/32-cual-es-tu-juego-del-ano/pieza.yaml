  instagram: |-
    Una pregunta y una sola respuesta: ¿cuál es tu juego del año? 🎮

    No tiene que ser GTA 6 ni pasar por Vice City o Leonida: vale cualquiera, de cualquier consola. Las normas son sencillas: uno solo, sin empates y sin destripar nada, tampoco de otros juegos. Comenta tu juego del año 👇 y etiqueta a quien seguro que dice otro distinto 😅

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #JuegoDelAño
