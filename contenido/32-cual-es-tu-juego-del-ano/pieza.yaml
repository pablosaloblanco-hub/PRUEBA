notas: |-
  Publicación suelta, 1 imagen: archivo 32-1.jpg. Pieza de comunidad: no afirma datos.
  Ángulo: debate de fin de año, GENÉRICO. Gancho: «¿CUÁL ES TU JUEGO DEL AÑO?». Subtítulo: «Solo uno. Vale cualquiera, no tiene que ser GTA 6». Bloque de 3 casillas, que son normas: «UNO SOLO · Sin empates» / «EL QUE SEA · De cualquier consola» / «SIN SPOILERS · Tampoco de otros juegos». CTA: «COMENTA TU JUEGO DEL AÑO 👇».
  PROHIBIDO: nombrar The Game Awards o cualquier gala, fechas de entregas, nominaciones o candidatos (ni de GTA VI ni de otros). Nada sin verificar. Nada de «GOTY» en la imagen para no sugerir un premio concreto.
  Si el 10/12 hay gala y GTA VI está nominado o gana, NO se improvisa nada: el investigador lo verifica y el director decide un post aparte otro día.
  Captura: DreQuan_Priest_03 (escenario con focos violetas, ambiente de «gran noche» sin nombrar nada). Rótulo sin nombre del personaje.
  Pablo: responder en la primera hora; dar «me gusta» solo a mano.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.
