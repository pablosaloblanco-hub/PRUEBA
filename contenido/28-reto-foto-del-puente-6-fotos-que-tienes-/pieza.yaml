notas: |-
  Carrusel, 5 diapositivas: archivos 28-1.jpg … 28-5.jpg. Pieza de comunidad: las categorías son genéricas y no afirman datos del juego.
  Ángulo: domingo del puente de diciembre (6/12 Constitución y 8/12 Inmaculada): reto para jugar estos días. Gancho de portada: «RETO FOTO DEL PUENTE: 6 fotos que tienes que hacer en Leonida».
  Las 6 categorías: 01 Un atardecer · 02 Un vehículo en marcha · 03 Un animal salvaje · 04 Vice City de noche · 05 Leonida desde las alturas · 06 La foto más rara que te salga.
  Las capturas de Rockstar son EJEMPLO/inspiración: rotular «EJEMPLO» para que no parezca una foto de un seguidor.
  No explicar cómo se hacen capturas de pantalla en PS5 o Xbox: no está en «Datos verificados» (solo lo de los clips). Si se quiere un paso técnico, PENDIENTE DE INVESTIGADOR; si no, se remite a nuestra guía del 21/11.
  No nombrar sitios concretos como objetivo de foto (evita mandar a la gente a zonas que quizá abre la historia más tarde).

  GUION:
  1/5 · portada (Ambrosia_04, atardecer industrial): etiqueta «RETO DEL PUENTE» · título «RETO <ye>FOTO</ye> EN <mag>LEONIDA</mag>» · subtítulo «6 fotos que tienes que hacer este puente» · chips: 6 FOTOS · SIN SPOILERS · MÁNDALA POR DM.
  2/5 · datos (Grassrivers_04, helicóptero y todoterrenos en el pantano), rótulo «RETOS 01–02»: «01 · UN ATARDECER · El cielo de Leonida a última hora» / «02 · UN VEHÍCULO EN MARCHA · Tierra, mar o aire: el que quieras».
  3/5 · datos (Leonida_Keys_06, iguana), rótulo «RETOS 03–04»: «03 · UN ANIMAL SALVAJE · Cuanto más cerca, mejor» / «04 · VICE CITY DE NOCHE · Luces, neón y calle».
  4/5 · datos (Mount_Kalaga_National_Park_04, cañón desde arriba), rótulo «RETOS 05–06»: «05 · DESDE LAS ALTURAS · Leonida a vista de pájaro» / «06 · LA MÁS RARA · La foto que no sabes explicar».
  5/5 · cierre (Cal_Hampton_03, flotador de flamenco: «la más rara»): brocha «¿Te apuntas?» · subtítulo «Guarda el reto y mándanos tus fotos por DM» · botones COMENTA / GUARDA / COMPARTE + «Compartimos las mejores mencionándote».
  Reglas para participar (texto): sin spoilers, sin interfaz de misión, que se vea solo el juego libre.
  Pablo: del 6 al 9/12 revisar los DM y guardar las fotos que valgan; pedir permiso por DM antes de compartir y mencionar siempre al autor (como con los clips del 21/11). Descartar las que tengan armas, contenido sexual, Lucia o Jason, o escenas de misión.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.
