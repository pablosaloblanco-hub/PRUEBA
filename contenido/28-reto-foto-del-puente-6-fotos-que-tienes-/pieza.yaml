  DISEÑO (19/11): 2/5 Grassrivers_04 → Ambrosia_01 (moteros en marcha por la carretera). Grassrivers_04 tiene a un hombre con un rifle en la camioneta y coches patrulla con sirenas: no vale (sin armas ni persecuciones). Ambrosia_01 solo salió el 2/12 (pieza 24), fuera de la semana 4-10/12. Rótulo «FOTO DE EJEMPLO» arriba a la derecha en 1/5 y 5/5. Textos sin cambios; subetiquetas «RETOS 01–02/03–04/05–06» no chocan con la marca de agua.
