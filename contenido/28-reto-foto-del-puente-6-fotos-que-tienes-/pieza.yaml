textos:
  instagram: |-
    RETO FOTO DEL PUENTE 📸 6 fotos que tienes que hacer en Leonida estos días.

    Un atardecer, un vehículo en marcha, un animal salvaje, Vice City de noche, Leonida desde las alturas y la foto más rara que te salga en GTA 6. Mándanos las tuyas por DM, sin spoilers ni pantallas de misión, y compartiremos las mejores mencionando al autor (siempre con su permiso). Guarda el reto para no dejarte ninguna y comenta cuál vas a hacer primero (01–06) 👇

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
