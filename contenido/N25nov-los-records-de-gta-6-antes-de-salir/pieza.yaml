textos:
  instagram: |-
    GTA 6 batió récords antes de salir 🏆

    El tráiler 1 se fue a 93 millones de visitas en YouTube en 24 horas, y el tráiler 2 pasó de los 475 millones en 24 horas sumando plataformas (según Rockstar a The Hollywood Reporter), por encima de los 365 millones del tráiler de Deadpool y Lobezno. El Guinness World Records Gamer's Edition 2027 lo deja por escrito: tráiler de videojuego más visto en 24 horas. Guarda el carrusel 📌 para la próxima discusión en el grupo y comenta qué récord crees que batirá ahora GTA VI 👇

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #RockstarGames
