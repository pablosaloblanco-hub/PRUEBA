notas: |-
  Carrusel útil, 5 diapositivas: archivos N25nov-1.jpg … N25nov-5.jpg. Recuperado del plan retirado (carrusel 17) e «Ideas guardadas» («Los récords del tráiler 1»).
  Ángulo: los números antes de salir; nada de ventas ni récords del lanzamiento (no verificados). Gancho de portada: «GTA 6 BATIÓ RÉCORDS ANTES DE SALIR».
  1 portada (Vice_City_10) con chips 93 M · 475 M · Guinness. 2 Tráiler 1: 4/12/2023, se adelantó un día por una filtración; 93 millones de visitas en YouTube en 24 h, el vídeo no musical más visto en su primer día (Vice_City_26). 3 Tráiler 2: 6/5/2025, por sorpresa; más de 475 millones en 24 h sumando plataformas; superó los 365 M de Deadpool y Lobezno (Leonida_Keys_06). 4 Guinness World Records Gamer's Edition 2027: tráiler de videojuego más visto en 24 h (Mount_Kalaga_04). 5 cierre: «¿Qué récord batirá ahora?» (Grassrivers_05).
  No se repite con «13 años esperando» del 18/11: aquí van las cifras, no la cronología.
  Si se quiere añadir algún récord de ventas o de jugadores del estreno: PENDIENTE DE INVESTIGADOR, no se publica sin verificar.
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite entre el 19 y el 26/11.
