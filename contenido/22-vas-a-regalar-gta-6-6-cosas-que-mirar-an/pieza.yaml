  instagram: '¿Vas a regalar GTA 6 estas Navidades? 🎁 Mira esto antes de pagar.


    Consola, caja sin disco, espacio, ediciones, GTA Online y bonus de reserva: las 6 cosas de GTA VI que conviene
    tener claras para que el regalo no falle y el primer viaje a Vice City (y al resto de Leonida) empiece sin sustos.
    Guarda el post para tenerlo a mano cuando vayas a comprarlo 📌 y comenta: ¿lo regalas tú o te lo regalan? 👇


    Imágenes: Rockstar Games · Cuenta fan · No oficial.

