notas: 'Ángulo: guía de compra para regalar en Navidad, publicada en Cyber Monday (30/11) sin depender de ofertas.
  Gancho portada: «¿VAS A REGALAR GTA 6? Mira esto antes de pagar». 8 diapositivas: 1) portada (Vice_City_10); 2)
  Consola: solo PS5 (mejorado para PS5 Pro) y Xbox Series X/S; no hay versión anunciada para PC, PS4 ni Xbox One
  (Vice_City_03); 3) Edición física sin disco: la caja trae un código (Leonida_Keys_01); 4) Espacio: hasta 212 GB
  según dispositivo (Vice_City_15); 5) Ediciones: Standard 79,99 € y Ultimate 99,99 €, PVP oficial en PS Store y
  Microsoft Store (Port_Gellhorn_06); 6) GTA Online no viene de salida, llegará más adelante (Mount_Kalaga_National_Park_03);
  7) El bonus de reserva (Vintage Vice City Pack) era para compras antes del 20/11 (Grassrivers_02); 8) cierre (Vice_City_27):
  «Guárdalo para cuando vayas a comprarlo». Pendiente de investigador: precio de Cyber Monday / Black Friday en
  PS Store y Microsoft Store España; si hay rebaja real, la diapositiva 5 dice «PVP oficial» y se añade la oferta
  con su fuente; si no, se deja el PVP como «precio oficial». También pendiente de investigador si se quiere: si
  el código de la caja necesita conexión a internet y la clasificación PEGI (no están en «Datos verificados»: no
  ponerlos hasta entonces). Evitar capturas con armas (público familiar que regala).'
