notas: |-
  Ángulo: comparativa útil (formato que funciona según el Plan de crecimiento): qué sitio real de Florida hay detrás de cada zona. Gancho portada: «LEONIDA EXISTE (CASI): los sitios reales que inspiran GTA 6». 6 diapositivas: 1) portada (Grassrivers_05: pantano con la ciudad al fondo; chips «Florida», «Miami», «Cayos», «Everglades»); 2) Vice City = Miami (Vice_City_15; Ocean Beach, Little Cuba, mercadillo Tisha-Wocka, puerto); 3) Leonida Keys = Cayos de Florida (Leonida_Keys_01, islas unidas por puentes); 4) Grassrivers = Everglades (Grassrivers_04, pantanos y manglares); 5) «Las otras 3 zonas» con lo que cuenta Rockstar, sin equivalente real: Port Gellhorn (Port_Gellhorn_06), Ambrosia (Ambrosia_04), Mount Kalaga (Mount_Kalaga_National_Park_03); 6) cierre (Vice_City_11): «¿Has estado en Miami o en los Cayos? Comenta / guarda / comparte». Solo las 3 equivalencias que da el dato (Miami, Cayos, Everglades) y Leonida = Florida. Equivalentes reales de Port Gellhorn, Ambrosia, Mount Kalaga o de barrios (Little Cuba, Ocean Beach): pendiente de investigador; si no llegan, la diapositiva 5 se queda como está. Nada de fotos reales de Florida (solo capturas oficiales). Nada de la historia: la fila «Historia» se usa solo por «Leonida (inspirado en Florida)».

