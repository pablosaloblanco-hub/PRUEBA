textos:
  instagram: |-
    LEONIDA EXISTE (CASI): los sitios reales que inspiran GTA 6 🌴

    Rockstar se ha inspirado en Florida para crear Leonida, y tres de sus zonas tienen un modelo real muy claro: Vice City se inspira en Miami, Leonida Keys en los Cayos de Florida y Grassrivers en los Everglades. Port Gellhorn, Ambrosia y Mount Kalaga completan el mapa de GTA VI con su propio carácter. Guarda el carrusel 📌 para tu próximo paseo por Leonida y comenta si has estado en Miami o en los Cayos 👇

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #Florida
