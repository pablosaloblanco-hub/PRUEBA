  DISEÑO (18/11, diseñador): fotos con quote() en diseno.py (rutas con espacios). Diapositiva 2: Vice_City_15 cambiada por Vice_City_03 (Vice_City_15 sale también en la 24 de la misma semana). Diapositiva 5: una sola foto (Port_Gellhorn_06), sin collage; Ambrosia_04 y Mount_Kalaga_National_Park_03 no se usan y salen de «capturas». Subetiquetas acortadas porque chocaban con la marca de agua de la plantilla: 3/6 «COMO LOS CAYOS DE FLORIDA» → «COMO LOS CAYOS»; 5/6 «LO QUE CUENTA ROCKSTAR» → «SEGÚN ROCKSTAR». Leonida_Keys_01 se mantiene (es la foto de islas y puentes del guion), aunque también la tiene la 19 (27/11).
