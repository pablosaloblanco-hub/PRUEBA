    Este coche ya no tiene arreglo en GTA 6 💀

    Un deportivo rojo, cuatro golpes y cero piedad: contra un coche blanco en plena autovía, otro roce que acaba en la hierba, el parachoques diciendo adiós y un último choque que lo deja descapotable. Espera al cuarto. ¿Cuál ha sido el peor? Comenta el número 👇 y etiqueta a quien conduce así en Vice City.

    Solo en el juego: en la vida real, despacio y con cabeza.

