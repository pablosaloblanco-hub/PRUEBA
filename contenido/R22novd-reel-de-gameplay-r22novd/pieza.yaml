notas: |-
  v1 (editor). Concepto: «ESTE COCHE YA NO TIENE ARREGLO 💀», 4 golpes seguidos del deportivo rojo, de día, en conducción libre (grabación g2_1958, 19/11). Gancho: choque contra el coche blanco en el primer frame con «ESPERA AL #4 💀» y «BRO 💀», zoom, temblor, destello y boom. Tramos (g2_1958.mp4): #1 00:29.6-00:34.4 a 1,2x (choque con coche blanco en la autovía y cámara de choque); #2 00:58.9-01:01.0 (roce con un sedán y a la hierba; + repetición 00:59.05-00:59.95 a 0,4x); #3 01:03.2-01:05.2 (se le cae el parachoques); #4 02:21.6-02:24.4 (choque con un todoterreno junto al camión y queda descapotable). Memes: ESPERA AL #4, BRO, MI SEGURO VIENDO ESTO, -1 COCHE, ESTO VA BIEN, PERDÓN, NO LO VI, SKILL ISSUE, SE LE CAE EL PARACHOQUES, FÍSICAS DE GTA 6, MODO KAMIKAZE, EL COCHE YA ES UN DESCAPOTABLE; cierre ¿CUÁL HA SIDO EL PEOR? 👇. Matrícula personalizada del coche (texto malsonante) pixelada con seguimiento en los planos traseros (fuentes en trabajo/<id>/fuentes/). HUD (brújula, marcador y distancia, minimapa) fuera del recorte; sin estrellas de búsqueda ni policía; sin peatones implicados; sin sangre ni armas. Música propia (musica.py, 124 bpm, tono 2). Sin audio original. Duración 16,1 s, 2,62 MB, 720x1280. Guion: trabajo/<id>/guion.json. Hoja: trabajo/<id>/hoja_fotogramas.jpg. Minutos usados de g2_1958: 00:29-00:35, 00:58.5-01:05.5, 02:21-02:25.
  v2 (tras la revisión): matrícula del #1 pixelada desde el fotograma 0 (seguimiento rehecho con zona de búsqueda en la trasera, 00:29.0-00:29.92); comprobados fotograma a fotograma los primeros 0,5 s de cada tramo. Mismos tramos, memes y duración (16,1 s, 2,62 MB).
