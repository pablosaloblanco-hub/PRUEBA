  instagram: |-
    GTA 6, pero todo me sale mal 🔨

    Un tablón escaleras abajo, una teja que acaba en el contenedor, un derrape para aparcar, una pickup que me llevo y que sin llave no arranca, y un día de pecho en el gimnasio que mejor no comentar. ¿Cuál te ha pasado a ti? Comenta el número 👇 y etiqueta a tu compañero de chapuzas en Vice City.

    Solo en el juego: en la vida real, se aparca despacio.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
