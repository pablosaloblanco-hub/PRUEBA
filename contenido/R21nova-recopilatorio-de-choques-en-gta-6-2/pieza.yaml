notas: 'Concepto: la grabación b no da más choques limpios (los demás son de noche o con violencia), así que esta es de fails y chapuzas: «GTA 6 pero todo me sale mal». Gancho: el tablón tirado escaleras abajo con polvareda en el primer segundo; repetición a cámara lenta de la teja; cierre con pregunta. Tramos (gta6_20261119_b.mp4): #1 32:28.5-32:30.0 tablón por la escalera; #2 18:29.1-18:30.9 teja al contenedor desde el tejado (+ repetición 18:29.4-18:30.6 a 0,4x); #3 36:43.0-36:45.3 derrape al aparcar; #4 46:09.4-46:12.4 pickup sin llave; #5 20:20.3-20:22.2 pesa rusa; #6 20:46.0-20:48.6 press de banca. Memes: ENTREGA EXPRÉS 📦, BRO 💀, TRIPLE DESDE EL TEJADO 🏀, PLAN PERFECTO, EJECUCIÓN…, MODO DERRAPE 🏎️, APARCAMIENTO 10/10 🅿️, ME LLEVO ESTA PICKUP 😎, SIN LLAVE NO ARRANCA 🔑💀, CUIDADO CON LA CABEZA 😬, YO EL LUNES: DÍA DE PECHO 💪; cierre ¿CUÁL TE HA PASADO A TI? 👇. Música propia (musica.py, 136 bpm, tono +3). Sin audio original. Duración 19,2 s, 2,62 MB, 720x1280. Guion: trabajo/<id>/guion.json.'
