notas: 'v1 (editor): formato G (POV narrado con `estilo: subtitulo`), «POV: tu primer día de repartidor en Leonida»
  con la furgoneta de g3_23_1548; gancho: el vuelco de la furgoneta en el primer segundo («Así acabó mi primer día
  de repartidor.» + BRO 💀) y después «3 HORAS ANTES ⏪» con scratch; cierre con pregunta. Tramos (g3_23_1548.mp4):
  #1 02:41.85-02:42.75 vuelco de la furgoneta junto al camión (la protagonista de espaldas; corta antes de 02:42.8,
  cuando se gira de perfil; recorte ancho [0.15, 0.11, 0.85, 0.85]); #2 01:52.0-01:55.0 cruce con carteles de carretera;
  #3 01:55.6-01:57.6 un todoterreno casi la embiste en el cruce; #4 02:12.0-02:14.4 carretera con las puertas de
  atrás abiertas y las cajas dentro (corta antes de 02:14.6: al fondo asoma un coche con luces); #5 02:34.4-02:35.45
  llegada a las obras; #6 02:35.5-02:36.4 cámara de choque contra el camión; #7 02:37.75-02:38.7 la furgo tras el
  golpe; #8 repetición 02:41.85-02:42.75 a 0,4x. Evitado: 01:48-01:51 (coche patrulla al lado), 02:24-02:31 (notificación
  de mensaje, además fuera de recorte), 02:29-02:30.6 (usado en S24d). Recorte con y0 = 0,11: fuera la brújula con
  iconos de misión y la distancia, el minimapa, la tarjeta del GPS, las notificaciones y los subtítulos. Sin armas
  a la vista (tampoco a la espalda), sin policía, sin menús ni llamadas, sin interiores de la tienda ni del almacén.
  Textos narrados: Así acabó mi primer día de repartidor. / Me dan la furgo de la licorería. «Es facilísimo», dicen.
  / Primer cruce. Primer susto. / Llevo las puertas de atrás abiertas. Las cajas, de excursión. / Llegan las obras.
  ¿Frenar? Para qué. / Bueno, aún arranca. / Y entonces la furgo dijo: hasta aquí. Memes: BRO 💀, 3 HORAS ANTES ⏪,
  CASI 😳, 📦👋, PUM 💥; cierre ¿ME CONTRATAN O NO? 👇. Música propia (musica.py, 120 bpm, tono 4). Sin audio original.
  Duración 16,2 s, 2,39 MB, 720x1280. Guion: trabajo/<id>/guion.json; hoja: trabajo/<id>/hoja_final.jpg.'
