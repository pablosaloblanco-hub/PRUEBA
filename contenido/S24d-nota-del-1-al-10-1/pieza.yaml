textos:
  instagram: |-
    Puntúo cómo conduzco cada vehículo en GTA 6 📝

    Moto: salgo volando contra un coche azul, 2/10 (el vuelo, un 10). Furgoneta: un camión por mi carril, o yo por el suyo, 5/10. Quad: un camión cisterna por los pelos, 8/10. Excavadora: el camión no pidió esto, 3/10. ¿Qué nota me das tú? Comenta 👇 y etiqueta a quien conduce peor que yo en Leonida.

    Solo en el juego: en la vida real, casco, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Gameplay
