  instagram: |-
    El único que conduce bien en GTA 6 😇

    Manos a las 10 y 10, a 50 por ciudad, paro en el STOP, cedo el paso, intermitente puesto y mi carril respetado. Mi profe de autoescuela llorando de orgullo… hasta que llegó el puente. No duró mucho 💀 ¿Y tú conduces así en Vice City? Comenta 👇 y etiqueta a quien jura que conduce perfecto.

    Solo en el juego: en la vida real, despacio y con cabeza.

    Imágenes: Rockstar Games · Cuenta fan · No oficial. Gameplay grabado en PS5 por @gta6espa.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Gameplay
