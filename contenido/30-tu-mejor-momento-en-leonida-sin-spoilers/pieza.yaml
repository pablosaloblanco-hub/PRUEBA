notas: |-
  Publicación suelta, 1 imagen: archivo 30-1.jpg. Pieza de comunidad: no afirma datos del juego.
  Ángulo: festivo (8/12, Inmaculada), casi tres semanas de juego: que la comunidad cuente su mejor momento FUERA de la historia. Gancho: «TU MEJOR MOMENTO EN LEONIDA». Subtítulo: «Sin spoilers: nada de misiones». Bloque interactivo de 3 casillas, que son pistas y no opciones: «UN SITIO · Dónde estabas» / «UN MOMENTO · Qué pasó» / «CERO SPOILERS · Nada de la historia». CTA: «CUÉNTANOSLO EN COMENTARIOS 👇».
  Distinto del 26/11 («lo mejor y lo peor» de la primera semana): aquí se pide UNA anécdota concreta de juego libre, no una valoración del juego.
  Captura: Port_Gellhorn_06 (atardecer sobre la costa). Ya salió como diapositiva interior el 28/11; es la reutilización más antigua posible.
  RIESGO DE SPOILERS EN COMENTARIOS: Pablo debe vigilar la primera hora y ocultar los que cuenten misiones, giros o finales. Fijar un comentario propio con un ejemplo inocente (p. ej. «el atardecer desde la carretera de la costa»).
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite dentro del 4–10/12.

  GUION DISEÑO:
  1 imagen 1080x1350 · archivo 30-1.jpg · single("Places/Port Gellhorn/Port_Gellhorn_06.jpg", kicker, título_html, subtítulo, bloque, cta, size=130). Si el título pasa de tres líneas, bajar a size=120.
    kicker: CUÉNTANOS TU ANÉCDOTA
    título_html: TU <span class="ye">MEJOR MOMENTO</span> EN <span class="mag">LEONIDA</span>
    subtítulo: Sin spoilers: <span class="cy">nada de misiones</span>
    bloque (mini con 3 casillas; son pistas para contarlo, no opciones para votar):
      mini([("pin", "UN SITIO", "Dónde estabas"),
            ("star", "UN MOMENTO", "Qué pasó"),
            ("x", "CERO SPOILERS", "Nada de la historia")])
      línea debajo de mini (26 px, centrada, cursiva): Ej.: «el atardecer desde la carretera de la costa»
    cta (píldora magenta): CUÉNTANOSLO EN COMENTARIOS 👇
    (Sin nada de la historia del juego. Ningún lugar concreto en la imagen: la etiqueta es solo «Leonida».)
  DISEÑO (19/11): single(size=130), título en 2 líneas; mini de 3 casillas + línea del ejemplo (26 px, cursiva). Textos sin cambios.
