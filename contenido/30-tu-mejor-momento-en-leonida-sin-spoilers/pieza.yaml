  instagram: |-
    ¿Cuál ha sido tu mejor momento en Leonida? 🌅 Sin spoilers, por favor.

    Llevamos casi tres semanas de GTA 6 y lo mejor muchas veces pasa lejos de las misiones: un atardecer desde la carretera de la costa, una vuelta sin rumbo por Vice City o algo absurdo que solo te ha pasado a ti. Cuéntanoslo en comentarios en una frase 👇 dónde estabas y qué pasó, sin nada de misiones ni de la historia 🌴

    Imágenes: Rockstar Games · Cuenta fan · No oficial.
    #GTA6 #GTAVI #GTA6Español #ViceCity #Leonida #GTA6Comunidad
