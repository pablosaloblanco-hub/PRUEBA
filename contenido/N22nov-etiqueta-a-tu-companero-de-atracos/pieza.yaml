notas: |-
  Publicación suelta, 1 imagen: archivo N22nov-1.jpg. Recuperada del plan retirado.
  Ángulo: domingo de juego con amigos. Gancho: «RAUL BAUTISTA, ATRACADOR VETERANO, BUSCA SOCIO» → «¿Con quién te la jugarías tú?». CTA en píldora magenta: «Etiqueta a tu compañero de atracos».
  Sin armas en la imagen ni en el texto, y nada de lo que hace Raul en la historia: solo la presentación oficial («atracador veterano»). No usar «Lucia tiene a Jason» del plan retirado.
  Choque de mecánica: el 1/12 ya hay «Etiqueta a tu dúo» (Real Dimez). Están separadas 9 días y el ángulo es distinto, pero el director debe confirmar que no cansa.
  Captura: Raul_Bautista_04 (americana blanca y luces de neón).
  Sin nada de la historia del juego (ni misiones, ni giros, ni finales). Crédito obligatorio en el texto: «Imágenes: Rockstar Games · Cuenta fan · No oficial». Capturas sin armas ni nada subido de tono; ninguna se repite entre el 19 y el 26/11.
