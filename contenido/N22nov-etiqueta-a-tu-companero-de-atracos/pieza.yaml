            ("users", "¿Y TU SOCIO?", "El que nunca te deja tirado"),
            ("car", "AL VOLANTE", "Conduce sin perder los nervios")])
    píldora magenta (cta): ETIQUETA A TU COMPAÑERO DE ATRACOS 👇
    (Solo la presentación oficial de Rockstar: «atracador veterano». Nada de lo que hace en la historia, ni armas, ni la frase «Lucia tiene a Jason». No se dice que se juegue en cooperativo.)

