    Raul Bautista, atracador veterano, busca socio. ¿Te apuntas? 😎

    Es uno de los personajes que Rockstar ha presentado en GTA 6 y su carta de presentación no deja dudas: atracador veterano. Domingo de partida en Vice City, así que dinos con quién te la jugarías tú: etiqueta a tu compañero de atracos 👇 El que conduce sin perder los nervios y nunca te deja tirado 🚗

