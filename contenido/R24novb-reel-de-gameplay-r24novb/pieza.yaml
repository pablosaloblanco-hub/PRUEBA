    Lo mejor de la semana en Vice City 🏆 Top 5

    En el puesto 5, un capó que sale volando; en el 4, un día de spa con vaqueros; en el 3, una moto de agua que no lo vio venir; en el 2, el carril contrario, que también cuenta, y en el número uno, una pick-up haciendo escalada libre en una palmera. ¿Cuál ha sido el mejor de la semana? Comenta el número 👇 y etiqueta a quien conduce así.

    Solo en el juego: en la vida real, despacio y con cabeza.

