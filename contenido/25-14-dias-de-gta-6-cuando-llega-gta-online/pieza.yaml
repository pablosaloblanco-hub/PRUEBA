notas: "Ángulo: efeméride con dato propio. GTA V salió el 17/09/2013 y GTA Online llegó el 01/10/2013: 14 días después.\
  \ GTA VI salió el 19/11/2026: el 3/12 se cumplen esos mismos 14 días, y Rockstar solo ha dicho que Online «llegará\
  \ más adelante». Gancho: «HOY HACE 14 DÍAS. En GTA V, a estas alturas ya había Online». Formato suelta: foto completa\
  \ + bloque de 3 opciones: A) Antes de Navidad, B) En la primera mitad de 2027, C) Más tarde. Píldora «Comenta\
  \ A, B o C». 1 imagen. Captura: Vice_City_08 (Vice City de noche con la noria). Es una pregunta, no una predicción:\
  \ no dar fechas ni rumores. Los 14 días son cálculo propio a partir de filas verificadas (como «Espera desde GTA\
  \ V»). Riesgo: si Rockstar anuncia la fecha de GTA Online antes del 3/12, la pieza cambia: pendiente de investigador\
  \ comprobarlo el 2/12. Para el coordinador: tema que puede coincidir con un Short de ChatGPT.\n\nGUION DISEÑO:\n\
  (1 imagen, archivo 25-1.jpg. Datos: filas «GTA V» (17/09/2013 y GTA Online el 01/10/2013), «Lanzamiento» (19/11/2026)\
  \ y «GTA Online» («llegará más adelante»); los 14 días son cálculo propio. Las tres opciones son respuestas para\
  \ votar, no fechas que demos nosotros.)\n\nsingle(Places/Vice City/Vice_City_08.jpg, kicker, título, subtítulo,\
  \ mini([...]), cta, size=120)\n- kicker: HOY HACE 14 DÍAS\n- título: ¿CUÁNDO LLEGA <span class=\"cy\">GTA ONLINE</span>?\n\
  - subtítulo: En GTA V, a estas alturas <span class=\"ye\">ya había Online</span>. De GTA VI, Rockstar solo ha\
  \ dicho que «llegará más adelante».\n- bloque interactivo: mini([\n    (\"star\", \"A · ANTES DE NAVIDAD\", \"\
  Me lo pido de regalo\"),\n    (\"clock\", \"B · PRIMERA MITAD DE 2027\", \"Toca esperar un poco\"),\n    (\"palm\"\
  , \"C · MÁS TARDE\", \"Mientras, a la playa\"),\n  ])\n- cta (píldora magenta): COMENTA A, B O C \U0001F447"
