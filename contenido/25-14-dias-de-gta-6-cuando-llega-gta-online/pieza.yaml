    ha dicho que Online «llegará más adelante», así que te lo preguntamos a ti: ¿cuándo crees que llega a Vice City
    y al resto de Leonida? Comenta A (antes de Navidad), B (en la primera mitad de 2027) o C (más tarde) 👇


