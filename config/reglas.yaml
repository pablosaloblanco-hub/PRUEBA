# Reglas de la cuenta GTA 6 Español (@gta6espa).
# Desde el 19/11 este archivo manda: Pablo gestiona todo desde este sistema (sin ChatGPT).
# El LÉEME de Drive queda como histórico y fuente de «Datos verificados». Aquí NO van IDs de Drive ni datos privados: el repo es público.

cuenta:
  usuario: "@gta6espa"
  marca_metricool: "GTA6ESPA"        # el ID se saca con getBrandSettings en cada sesión
  marca_prohibida: "DRONEFLOW"       # otra cuenta de Pablo: no mezclar nunca
  zona_horaria: "Europe/Madrid"
  idioma: "español de España"

reparto:
  claude: [instagram, tiktok, youtube, comprobar_publicaciones, informe_semanal]
  pablo: [grabar_gameplay_ps5, responder_comentarios, seguir_cuentas_a_mano, pegatinas_historias, revisar_dm]

horarios:
  publicacion: ["10:00", "18:00"]    # carruseles y publicaciones sueltas
  historia: ["13:00"]
  reel: ["11:30", "14:30", "20:30"]        # Reels de gameplay en Instagram + TikTok + Short de YouTube
  reel_extra: ["16:30", "22:30"]           # Reels SOLO en TikTok + Short (Instagram no pasa de 3 al día)
  separacion_minima_min: 60          # entre dos piezas distintas de la misma red
  # 18/11: máximo 1 de feed en Instagram tras la restricción por exceso de publicaciones.
  # 19/11 (Pablo, restricción resuelta): Reels de gameplay aparte del feed.
  # 19/11 noche (Pablo: «al máximo razonable»): 3 Reels al día en Instagram, 5 en TikTok y 5 Shorts.
  # Instagram es la red sensible (restringió el 18/11): si vuelve a avisar de restricción, bajar a 2.
  maximo_diario:
    instagram: {feed: 1, reel: 3, historia: 1}
    tiktok: {feed: 3, reel: 5, historia: 0}
    youtube: {reel: 5}
  reels_gameplay_diarios: {instagram: 3, tiktok: 5, youtube: 5}
  # 19/11 (Pablo): en el arranque de la cuenta quiere MUCHO contenido. Los máximos son una guía para
  # planificar, no motivo para retirar nada: no se quita ni se pasa a borrador lo programado sin que él lo pida.

formatos:
  carrusel: {ancho: 1080, alto: 1350, min: 2, max: 20}
  suelta:   {ancho: 1080, alto: 1350, min: 1, max: 1}
  historia: {ancho: 1080, alto: 1920, min: 1, max: 1}
  reel:     {ancho: 720,  alto: 1280, duracion_min_s: 8, duracion_max_s: 60, duracion_ideal_s: [15, 40]}
  extension_imagen: [".jpg", ".jpeg"]   # TikTok no acepta PNG en carruseles
  extension_video: [".mp4"]
  tamano_max_mb: 3                      # límite de subida de Claude a Drive

textos:
  credito_completo: "Imágenes: Rockstar Games · Cuenta fan · No oficial"
  credito_minimo: "Imágenes: Rockstar Games"
  hashtags_obligatorios: ["#GTA6", "#GTAVI", "#GTA6Español", "#ViceCity", "#Leonida"]
  hashtags_tiktok_extra: ["#parati"]
  hashtags_max_instagram: 6
  hashtags_max_tiktok: 7
  max_caracteres_instagram: 2200
  max_caracteres_tiktok: 2200
  max_caracteres_titulo_tiktok: 90

# Frases que no pueden aparecer en ningún texto (datos antiguos o falsos, según el LÉEME).
frases_prohibidas:
  - "26 de mayo de 2026"
  - "próximamente en 2025"
  - "disponible en pc"
  - "sale en pc"
  - "motor rage evolucionado"
  - "gta online ya disponible"

# Palabras que obligan a revisar a mano por posible spoiler (aviso, no error).
palabras_spoiler:
  - "spoiler"
  - "final del juego"
  - "misión final"
  - "último capítulo"
  - "muere"
  - "giro de guion"
  - "traición"
  - "desenlace"

capturas:
  pack_oficial: "https://media-rockstargames-com.akamaized.net/VI/downloads/screenshots/GTAVI_Screenshots.zip"
  carpetas_permitidas: ["Places", "People"]
  carpetas_prohibidas: ["Lucia Caminos", "Jason Duval", "Jason and Lucia"]
  ancho_redimensionado: 1920
  # Capturas concretas de Places/People que no se pueden usar (salen Lucia o Jason,
  # contenido sexual, etc.). Las añade el agente revisor cuando detecta una.
  lista_negra: "config/capturas_bloqueadas.txt"

estados:
  - idea
  - aprobada
  - redactada
  - disenada
  - revisada
  - subida
  - programada
  - publicada
  - error
  - descartada

# Clips de streamers y youtubers (Pablo, 19/11: sin pedir permisos). Modo «cita»: fragmento corto,
# crédito y edición propia encima; si el creador pide retirarlo, se retira ese mismo día.
clips_creadores:
  max_cita_s: 10          # por creador y vídeo, sin permiso
  max_total_clip_s: 30    # suma de fragmentos ajenos en un mismo vídeo
